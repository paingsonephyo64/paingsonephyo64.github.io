<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Multiple</h1>
    <script>
        let num=prompt("enter a number as you like");

        for(let i=1; i<=12;i++){
            let ans =num*i;
            let anss=` ${num} x ${i} = ${ans} <br>`;
            
            document.write(anss );
        }

        for(let i=5;i>=1;i--){
            for(let k=1;k<=i;k++){
                document.write("*");
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
