<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello HTML.</h1>

    <!-- tag -->

     <p></p>

     <!-- Element -->
     <p>Hello</p>
     <div>
        <h1>Hi</h1>
     </div>
      
     <!-- Attribute -->
      <p align="right">This is p element 1</p>
      <p align="center">This is p element 2</p>
      <p align="right">This is p elelment 3</p>

      <!-- Global Attribute -->
       <p class="p-text p-element p-tag" id="p4">This is p element 4</p>
       <p class="p-text" id="p5">This is p element 5</p>

       <h1>Hello</h1>
       <h1>Hi</h1>
       <p>Hello guys.</p>

       <!-- ugly code  -->
        <div><div><h1>hello</h1><p>this is paragraph p</p></div><div><h1>Hi</h1><p>this is paragraph2</p></div></div>


       <!-- pretty code -->
       <div>
           <div>
               <h1>Title 1</h1>
               <p>This is paragraph.</p>
           </div>
           <div>
                <h1>Title 2</h1>
                <p>This is paragraph.</p>
           </div>
       </div>
</body>
</html>
