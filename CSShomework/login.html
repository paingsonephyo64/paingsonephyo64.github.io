<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <div class="mainbody">
        <div class="head">
            <h1>Welcome Back!</h1>
            <p>Please login to your account</p>
        </div>
        <form action="HTMLAssignment/index.html" method="post">
            <div class="input1">
                 <label for="emailA">Email Address</label>
                 <input type="text" name="email" id="emailA" placeholder="Enter your email" required>
            </div>
            <div class="input1">
                 <label for="password">Password</label>
                 <input type="password" name="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="remember">
                <input type="checkbox" name="checkbox" id="chkbox">
                <label for="chkbox">Remember me</label>
                <a href="">Forget Password?</a>
            </div>  
            <div class="btn">
                <button type="submit">Login</button>
            </div>         
        </form>
        <div class="foot">
             <p>Don't have an account? <a href="">Sign Up</a></p>
        </div>

      </div>
   
</body>
</html>
